services:
  # 1. Reverse Proxy & Tự động cấp SSL HTTPS
  caddy_gateway:
    image: caddy:2-alpine
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./frontend:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend_api

  # 2. Backend RESTful API Core (Node.js Express / Fastify)
  backend_api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "5050:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://metro_user:metro_pass@db_postgres:5432/metro2_survey
      - JWT_SECRET=metro2_super_secure_jwt_secret_key_2026
      - S3_ENDPOINT=http://minio_storage:9000
      - S3_ACCESS_KEY=metro_minio_admin
      - S3_SECRET_KEY=metro_minio_secret_key
      - S3_BUCKET_NAME=metro2-photos
    depends_on:
      - db_postgres
      - minio_storage

  # 3. Database PostgreSQL 16 + PostGIS Extension
  db_postgres:
    image: postgis/postgis:16-3.4-alpine
    restart: always
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=metro2_survey
      - POSTGRES_USER=metro_user
      - POSTGRES_PASSWORD=metro_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init_schema.sql:/docker-entrypoint-initdb.d/01_init_schema.sql
      - ./database/seed_data.sql:/docker-entrypoint-initdb.d/02_seed_data.sql

  # 4. Object Storage MinIO (S3 Nội bộ lưu trữ ảnh bằng chứng phi hủy diệt)
  minio_storage:
    image: quay.io/minio/minio:latest
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=metro_minio_admin
      - MINIO_ROOT_PASSWORD=metro_minio_secret_key
    volumes:
      - minio_data:/data

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  minio_data:
