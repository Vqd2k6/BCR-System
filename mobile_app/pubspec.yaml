name: ksqh_metro2_mobile
description: "Ứng dụng Di Động Khảo Sát Hiện Trạng Công Trình Tuyến Metro Số 2 (KSQH)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  intl: ^0.19.0

  # GIS & Bản Đồ
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # Định vị GPS Ngầm (Dual-GPS Anti-cheat)
  geolocator: ^11.0.0

  # Máy ảnh & Xử lý Ảnh Watermark
  image_picker: ^1.0.7
  image: ^4.1.7

  # Mạng & REST API
  dio: ^5.4.1
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
